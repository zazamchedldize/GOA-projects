string - ნებისმიერი ტექსტი რაც მოთავსებულია ბრჭყალებში
number - ნებისმიერი ათწილადი და მთელი რიცხვი
boolean - true და false
BigInt - ძალიან დიდი რიცხვები
null - მნიშვნელობის არარსებობა
undefined -  ცვლადი რომელსაც ჯერ არ აქვს მინიჭებული მნიშვნელობა
