
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerbalizeIt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="section1">

        <header>
            <nav>
                <h1 class="verb">VerbalizeIt</h1>

                <ul>
                    <li>Service</li>
                    <li>Blog</li>
                    <li>About us</li>
                    <li>Contact us</li>
                </ul>

                <button class="reg">Register</button>

                <button class="burger" type="button">
                    <img src="images/burger-bar.png" alt="Menu">
                </button>
            </nav>
        </header>

        <div class="div1">

            <div class="texts1">
                <h1>We make you learn language easily!</h1>

                <p>
                    We help you learn language easily, with small lessons,
                    you'll earn points and unlock new levels while improving
                    your real world communications.
                </p>

                <form>
                    <input type="email" placeholder="Enter your email">
                    <button class="formbutton">Get Started</button>
                </form>
            </div>

            <img src="images/mobile.png" class="section1img" alt="Mobile">

        </div>

        <div class="cards">

            <div class="images">
                <img src="images/Ellipse 252.png" alt="">
                <img src="images/Ellipse 248.png" alt="">
                <img src="images/Ellipse 251.png" alt="">
                <img src="images/Ellipse 250.png" alt="">
                <div class="icon5">2m</div>
                <p class="studentstext">Students Inroll</p>
            </div>

            <div class="debitcards">
                <img src="images/Component 50 (1).png" alt="">
                <img src="images/spotify-seeklogo.com 2 (1).png" alt="">
                <img src="images/Component 51 (1).png" alt="">
                <img src="images/zoom-seeklogo.com-1 (1).png" alt="">

        </div>

    </section>
